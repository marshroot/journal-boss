services:
  livekit:
    image: livekit/livekit-server:1.13.9
    restart: unless-stopped
    command: --config /config/livekit.yaml
    volumes:
      - ./livekit/config.yaml:/config/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7880/"]
      start_period: 10s
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - jornal

  backend:
    build: ./backend/JournalBackend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JOURNAL_VERSION: ${JOURNAL_VERSION:-v23-P75}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/journal.db
      Jwt__Key: ${JWT_KEY:?set JWT_KEY to at least 32 characters}
      Jwt__Issuer: JournalBackend
      Jwt__Audience: JournalFrontend
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:3000}
      Collab__DatabasePath: /collab-data/collab.sqlite
      Admin__InitialLogin: ${ADMIN_LOGIN:-}
      Admin__InitialPassword: ${ADMIN_PASSWORD:-}
      Judge0__Url: ${JUDGE0_URL:-}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_SERVER_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-7200}
      APPLICATION_KEY: ${APPLICATION_KEY:-}
      MYSTAT_RATE_LIMIT_MS: ${MYSTAT_RATE_LIMIT_MS:-0}
      DataProtection__KeyRingPath: /data/keys
    volumes:
      - journal_data:/data
      - journal_uploads:/app/storage
      - collab_data:/collab-data
    expose:
      - "8080"
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      start_period: 30s
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - jornal

  collab:
    build: ./collab
    restart: unless-stopped
    environment:
      PORT: 1234
      JWT_KEY: ${JWT_KEY:?set JWT_KEY to at least 32 characters}
      JWT_ISSUER: JournalBackend
      SQLITE_PATH: /data/collab.sqlite
    volumes:
      - collab_data:/data
    expose:
      - "1234"
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'); const s=net.connect(1234,'127.0.0.1',()=>{s.end();process.exit(0)}); s.on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - jornal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
      collab:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      start_period: 10s
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - jornal

networks:
  jornal:
    driver: bridge

volumes:
  journal_data:
  journal_uploads:
  collab_data:
